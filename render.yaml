# One-click deploy to Render: https://render.com/deploy?repo=https://github.com/claudekovalenko/ai-entrepreneur-network
services:
  - type: web
    name: ai-entrepreneur-network
    runtime: node
    plan: starter # disks (needed to keep the database) require a paid plan
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_FILE
        value: /var/data/network.db
      - key: SECURE_COOKIES
        value: "true"
      - key: INVITE_CODE
        sync: false # Render asks for this during setup
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
